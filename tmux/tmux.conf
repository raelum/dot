# Allows finger scrolling
set -g mouse on

# Auto-enter copy mode on wheel up, but pass directly to nvim
bind -n WheelUpPane if-shell -F -t = "#{||:#{mouse_any_flag},#{alternate_on}}" "send-keys -M" "copy-mode -et="

# Enable focus events so nvim can detect pane switching
set -g focus-events on

# Enable clipboard synchronization with system clipboard
set -s set-clipboard on

# Use Vi keybindings in copy mode:
# - v to begin selection
# - y to copy to Android clipboard
# - Enter, Escape, or q to exit
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "termux-clipboard-set"
bind -T copy-mode-vi Enter send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste from Android system clipboard via Termux:API (prefix + ])
bind-key ] run-shell "termux-clipboard-get | tmux load-buffer - && tmux paste-buffer -p -t #{pane_id}"

# Status bar (clean look without localhost or date/time)
set -g status-right ""

# Clean up window name for glibc-loader binaries (show agy instead of ld-linux-aarch64.so.1)
set -g automatic-rename-format "#{s/ld-linux.*/agy/:pane_current_command}#{?pane_dead,[dead],}"

# ==========================================
# Antigravity Actions Popup Menu
# ==========================================
bind-key a if-shell -F "#{m:*agy*,#{window_name}}" \
  "display-menu -T '#[align=centre]Antigravity' -x C -y C \
    'Undo 1 Turn'  u \"run-shell \\\"tmux send-keys -t #{pane_id} Escape; sleep 0.2; tmux send-keys -t #{pane_id} /rewind Enter; sleep 0.2; tmux send-keys -t #{pane_id} Up Enter\\\"\" \
    'Resume Chat'  r \"send-keys '/resume' Enter\" \
    'Clear Chat'   c \"send-keys '/clear' Enter\"" \
  "display-message 'AGY: Not inside an Antigravity window'"

# ==========================================
# Floating Todo Popup
# ==========================================
# Open todo.md in a floating popup
bind-key t run-shell "~/.tmux/scripts/todo-popup.sh"

# ==========================================
# Global Screen Padding (Fixed Width with Dots)
# ==========================================
# Toggles a global fixed-width window layout across all windows/sessions:
# - Padding ON: Constrains all windows to ~69 columns (dots on right) for floating keyboard.
# - Padding OFF: Restores full-width client size (for portrait or Bluetooth keyboard).
bind-key P run-shell "~/.tmux/scripts/toggle-screen-padding.sh"

# ==========================================
# Tmux Plugin Manager (TPM) & Session Persistence
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Auto-restore previous environment on tmux start
set -g @continuum-restore 'on'

# Auto-save interval in minutes (default 15)
set -g @continuum-save-interval '10'

# Also auto-save immediately whenever client detaches (e.g. Termux closed or minimized)
set-hook -g client-detached 'run -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# Initialize TPM (must stay at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
